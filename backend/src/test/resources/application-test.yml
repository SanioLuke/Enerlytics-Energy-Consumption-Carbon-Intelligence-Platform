spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS iam\;CREATE SCHEMA IF NOT EXISTS org
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration

enerlytics:
  security:
    jwt:
      access-secret: test-access-secret-key-must-be-at-least-256-bits-long-1234
      refresh-secret: test-refresh-secret-key-must-be-at-least-256-bits-long-1234
      access-expiration-ms: 3600000
      refresh-expiration-ms: 86400000
    dev-admin:
      email:
      password:
