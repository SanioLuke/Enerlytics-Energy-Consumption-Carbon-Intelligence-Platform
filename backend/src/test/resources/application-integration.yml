spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS iam\;CREATE SCHEMA IF NOT EXISTS org\;CREATE SCHEMA IF NOT EXISTS telemetry
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      enable-idempotence: true
    consumer:
      group-id: enerlytics-telemetry-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

enerlytics:
  kafka:
    topics:
      meter-reading-received: enerlytics.telemetry.meter-reading-received.v1
      meter-reading-validated: enerlytics.telemetry.meter-reading-validated.v1
      meter-reading-rejected: enerlytics.telemetry.meter-reading-rejected.v1
    consumer:
      groups:
        ingestion: enerlytics-telemetry-ingestion
  outbox:
    relay:
      interval: PT0.2S
      page-size: 100
  security:
    jwt:
      access-secret: test-access-secret-key-must-be-at-least-256-bits-long-1234
      refresh-secret: test-refresh-secret-key-must-be-at-least-256-bits-long-1234
      access-expiration-ms: 3600000
      refresh-expiration-ms: 86400000
    dev-admin:
      email:
      password:

internal:
  api:
    key: test-internal-api-key
