server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:enerlytics-backend}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/enerlytics}
    username: ${DATABASE_USERNAME:enerlytics}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: iam
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    default-schema: iam
    schemas: iam,org

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      enable-idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:enerlytics-backend}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

enerlytics:
  kafka:
    topics:
      meter-reading-received: ${SIMULATOR_KAFKA_TOPIC:enerlytics.telemetry.meter-reading-received.v1}
      meter-reading-validated: ${METER_READING_VALIDATED_TOPIC:enerlytics.telemetry.meter-reading-validated.v1}
      meter-reading-rejected: ${METER_READING_REJECTED_TOPIC:enerlytics.telemetry.meter-reading-rejected.v1}
    consumer:
      groups:
        ingestion: ${KAFKA_INGESTION_GROUP_ID:enerlytics-telemetry-ingestion}
  outbox:
    relay:
      interval: ${OUTBOX_RELAY_INTERVAL:PT1S}
      page-size: ${OUTBOX_RELAY_PAGE_SIZE:100}
  security:
    jwt:
      access-secret: ${JWT_ACCESS_SECRET:change-me-in-production-access-secret-key-min-256-bits}
      refresh-secret: ${JWT_REFRESH_SECRET:change-me-in-production-refresh-secret-key-min-256-bits}
      access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    dev-admin:
      email: ${DEV_ADMIN_EMAIL:}
      password: ${DEV_ADMIN_PASSWORD:}
      display-name: ${DEV_ADMIN_DISPLAY_NAME:Development Admin}
      organization-key: ${DEV_ADMIN_ORG_KEY:dev-organization}
      organization-name: ${DEV_ADMIN_ORG_NAME:Development Organization}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

internal:
  api:
    key: ${INTERNAL_API_KEY:}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.enerlytics: ${LOG_LEVEL_APP:DEBUG}
